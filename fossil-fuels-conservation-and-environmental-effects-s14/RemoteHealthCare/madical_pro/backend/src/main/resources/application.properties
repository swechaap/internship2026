spring.application.name=backend

# Database - uses environment variables in production, falls back to local values
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/medical_pro?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Nanda@2007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server port - uses environment variable in production
server.port=${PORT:8080}

# CORS - Allow frontend domain
spring.web.cors.allowed-origins=*
